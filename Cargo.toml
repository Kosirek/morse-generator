[package]
name = "morse"
version = "0.1.0"
edition = "2024"

[dependencies]
morse_lib = { path = "crates/morse_lib" }
clap = { version = "4.5.48", features = ["derive"] }

[profile.release]
opt-level = 3
debug = true
codegen-units = 1
lto = "fat"
panic = "abort"
incremental = false
strip = "symbols"
